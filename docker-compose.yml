services:
  app:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: "true"   # set "false" for a slim image without Chromium
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional HTTPS reverse proxy (Caddy + automatic Let's Encrypt).
  # Set DOMAIN=tracker.deinedomain.de in .env, point its DNS A-record at the
  # server, then start with:  docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Optional Postgres — enable with:  docker compose --profile postgres up -d
  # and set in .env: DATABASE_URL=postgresql+asyncpg://tcg:tcg@db:5432/tcg
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  caddy_data:
  caddy_config:
