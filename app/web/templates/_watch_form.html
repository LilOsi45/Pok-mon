<h2>{{ 'Edit watch' if watch else 'Add watch' }}</h2>
<form method="post" action="{{ '/watches/' ~ watch.id if watch else '/watches' }}">
  <div class="form-grid">
    <div class="span-2">
      <label for="f-label">Label</label>
      <input id="f-label" name="label" required placeholder="e.g. OP-09 Booster Box (EN)" value="{{ watch.label if watch else '' }}">
    </div>
    <div>
      <label for="f-game">Game</label>
      <select id="f-game" name="game">
        {% for value, name in games %}
        <option value="{{ value }}" {{ 'selected' if watch and watch.game.value == value }}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="f-retailer">Retailer (display name)</label>
      <input id="f-retailer" name="retailer" placeholder="Amazon.de" value="{{ watch.retailer if watch else '' }}">
    </div>
    <div class="span-2">
      <label for="f-url">Product URL</label>
      <input id="f-url" name="url" type="url" required placeholder="https://…" value="{{ watch.url if watch else '' }}">
    </div>
    <div>
      <label for="f-adapter">Adapter</label>
      <select id="f-adapter" name="adapter">
        <option value="">Auto (by domain)</option>
        {% for slug, name in adapters %}
        <option value="{{ slug }}" {{ 'selected' if watch and watch.adapter == slug }}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="f-interval">Poll interval (s)</label>
      <input id="f-interval" name="interval_seconds" type="number" min="60" value="{{ watch.interval_seconds if watch else defaults.interval }}">
    </div>
    <div>
      <label for="f-cooldown">Cooldown (s)</label>
      <input id="f-cooldown" name="cooldown_seconds" type="number" min="0" value="{{ watch.cooldown_seconds if watch else defaults.cooldown }}">
    </div>
    <div class="span-2">
      <label>Channels — anklicken, wo der Ping landen soll</label>
      {% include "_channel_picker.html" %}
    </div>
    <div>
      <label for="f-price-target">Preisalarm ab (€, optional)</label>
      <input id="f-price-target" name="price_target" inputmode="decimal" placeholder="z. B. 129,99"
             value="{{ '%.2f'|format(watch.price_target) if watch and watch.price_target else '' }}">
    </div>
    <div>
      <label for="f-ref-price">Cardmarket-Referenzpreis (€, optional)</label>
      <input id="f-ref-price" name="reference_price" inputmode="decimal" placeholder="z. B. 89,90"
             value="{{ '%.2f'|format(watch.reference_price) if watch and watch.reference_price else '' }}">
    </div>
    <div class="span-2">
      <label for="f-ref-url">Cardmarket-Link zum Produkt (optional)</label>
      <input id="f-ref-url" name="reference_url" type="url" placeholder="https://www.cardmarket.com/de/…"
             value="{{ watch.reference_url or '' if watch else '' }}">
    </div>
    <div>
      <label for="f-cardmarket">Cardmarket-Produkt-ID (nur mit API-Zugang)</label>
      <input id="f-cardmarket" name="cardmarket_id" inputmode="numeric" placeholder="z. B. 771234"
             value="{{ watch.cardmarket_id if watch and watch.cardmarket_id else '' }}">
    </div>
    <div>
      <label for="f-priority" style="text-transform:none">Wichtig — @everyone-Ping 🔔</label>
      <input id="f-priority" name="priority" type="checkbox" style="width:auto" {{ 'checked' if watch and watch.priority }}>
    </div>
    <div>
      <label for="f-first-seen" style="text-transform:none">Auch melden, wenn schon verfügbar</label>
      <input id="f-first-seen" name="notify_on_first_seen" type="checkbox" style="width:auto" {{ 'checked' if watch and watch.notify_on_first_seen }}>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{ 'Save changes' if watch else 'Add watch' }}</button>
    {% if watch %}<a class="btn btn-ghost" href="/watches">Cancel</a>{% endif %}
  </div>
</form>
