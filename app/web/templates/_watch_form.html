<h2>{{ 'Edit watch' if watch else 'Add watch' }}</h2>
<form method="post" action="{{ '/watches/' ~ watch.id if watch else '/watches' }}">
  <div class="form-grid">
    <div class="span-2">
      <label for="f-label">Label</label>
      <input id="f-label" name="label" required placeholder="e.g. OP-09 Booster Box (EN)" value="{{ watch.label if watch else '' }}">
    </div>
    <div>
      <label for="f-game">Game</label>
      <select id="f-game" name="game">
        {% for value, name in games %}
        <option value="{{ value }}" {{ 'selected' if watch and watch.game.value == value }}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="f-retailer">Retailer (display name)</label>
      <input id="f-retailer" name="retailer" placeholder="Amazon.de" value="{{ watch.retailer if watch else '' }}">
    </div>
    <div class="span-2">
      <label for="f-url">Product URL</label>
      <input id="f-url" name="url" type="url" required placeholder="https://…" value="{{ watch.url if watch else '' }}">
    </div>
    <div>
      <label for="f-adapter">Adapter</label>
      <select id="f-adapter" name="adapter">
        <option value="">Auto (by domain)</option>
        {% for slug, name in adapters %}
        <option value="{{ slug }}" {{ 'selected' if watch and watch.adapter == slug }}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="f-interval">Poll interval (s)</label>
      <input id="f-interval" name="interval_seconds" type="number" min="60" value="{{ watch.interval_seconds if watch else defaults.interval }}">
    </div>
    <div>
      <label for="f-cooldown">Cooldown (s)</label>
      <input id="f-cooldown" name="cooldown_seconds" type="number" min="0" value="{{ watch.cooldown_seconds if watch else defaults.cooldown }}">
    </div>
    <div>
      <label for="f-channels">Channels (comma-sep.)</label>
      <input id="f-channels" name="channels" placeholder="pokemon, hot-drops" value="{{ watch.channels|join(', ') if watch else '' }}">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{ 'Save changes' if watch else 'Add watch' }}</button>
    {% if watch %}<a class="btn btn-ghost" href="/watches">Cancel</a>{% endif %}
  </div>
</form>
