<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TCG Tracker{% endblock %}</title>
  <!-- iOS / Android home-screen app -->
  <meta name="theme-color" content="#0D0B14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TCG Tracker">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/holo.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
{% if hide_nav %}
  {% block bare %}{% endblock %}
{% else %}
<div class="shell">
  <aside class="sidebar">
    <div class="brand">TCG Tracker<small>Holo Foil Monitor</small></div>
    <nav class="nav-links">
      <a class="nav-link {{ 'active' if active == 'watches' }}" href="/watches">Watches</a>
      <a class="nav-link {{ 'active' if active == 'news' }}" href="/news">News feed</a>
      <a class="nav-link {{ 'active' if active == 'scanner' }}" href="/scanner">Scanner</a>
      <a class="nav-link {{ 'active' if active == 'discovery' }}" href="/discovery">Discovery</a>
      <a class="nav-link {{ 'active' if active == 'shops' }}" href="/shops">Shops</a>
      <a class="nav-link {{ 'active' if active == 'notifications' }}" href="/notifications">Notifications</a>
      <a class="nav-link {{ 'active' if active == 'settings' }}" href="/settings">Settings</a>
    </nav>
    <form method="post" action="/logout" class="logout-form">
      <button class="btn btn-ghost btn-sm" type="submit">Log out</button>
    </form>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% endif %}
</body>
</html>
