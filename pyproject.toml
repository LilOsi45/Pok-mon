[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-tracker"
version = "0.1.0"
description = "Self-hosted Pokémon TCG & One Piece Card Game news aggregator and stock/restock monitor for European shops"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
playwright = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]  # E501 handled by black; B008 is FastAPI Depends idiom

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
